<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E32636">
    <title>Contact - Bloopville</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="manifest" href="../manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>


<header class="site-header">
    <div class="container header-inner">
        <a href="../index.html" class="logo"><span class="logo-bubble"></span> Bloopville</a>
        <nav class="main-nav">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="characters.html">Characters</a></li>
                <li><a href="products.html">Shop</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="header-actions"><button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">&#x1F319;</button>
            <button class="cart-btn" id="cartBtn">Cart <span class="cart-count" id="cartCount">0</span></button>
        </div>
    </div>
</header>

<section class="hero" style="padding:90px 0 150px;">
    <div class="hero-bubbles"><span></span><span></span><span></span><span></span></div>
    <div class="container hero-content">
        <p class="hero-tag">Let us Chat</p>
        <h1>Get in Touch</h1>
        <p class="hero-text">We would love to hear from you! Questions, ideas, or just want to say hi? Drop us a message.</p>
    </div>
    <div class="hero-wave"></div>
</section>

<section class="section">
    <div class="container" style="max-width:620px;">
        <form id="contact-form" style="display:flex; flex-direction:column; gap:20px;">
            <input type="text" placeholder="Your Name" required
                style="padding:18px 22px; border:2px solid #eee; border-radius:14px; font-size:1rem; font-family:inherit; outline:none;">
            <input type="email" placeholder="Your Email" required
                style="padding:18px 22px; border:2px solid #eee; border-radius:14px; font-size:1rem; font-family:inherit; outline:none;">
            <textarea placeholder="Your Message" rows="6" required
                style="padding:18px 22px; border:2px solid #eee; border-radius:14px; font-size:1rem; font-family:inherit; resize:vertical; outline:none;"></textarea>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</section>
<script>
document.getElementById('contact-form').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Thank you! We will get back to you soon.');
    this.reset();
});
</script>

<footer class="site-footer">
    <div class="container footer-bottom">
        <p>&copy; 2026 Bloopville. All rights reserved.</p>
    </div>
</footer>

<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header"><h3>Your Cart</h3><button class="close-cart" id="closeCart">&#x2715;</button></div>
    <div class="cart-items" id="cartItems"><p class="empty-cart">Your cart is empty</p></div>
    <div class="cart-footer">
        <div class="cart-total"><span>Total:</span><span id="cartTotal">.00</span></div>
        <button class="btn btn-primary btn-full" onclick="checkout()">Checkout</button>
    </div>
</div>
<div class="cart-overlay" id="cartOverlay"></div>



<script src="../assets/js/main.js"></script>
</body>
</html>
